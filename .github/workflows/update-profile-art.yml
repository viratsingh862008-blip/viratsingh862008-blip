name: Refresh profile visuals

concurrency:
  group: profile-visual-refresh
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: pip install Pillow==11.1.0
      - name: Fetch public GitHub activity and render SVG cards
        run: python scripts/profile_art.py
      - name: Commit refreshed profile cards and contribution data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh editorial profile cards [skip ci]"
          file_pattern: "cards/*.svg data/contributions.json"
