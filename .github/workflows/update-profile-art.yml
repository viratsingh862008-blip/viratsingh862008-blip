name: Update profile art

concurrency:
  group: profile-art-refresh
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contributions and render animated SVGs
        run: python scripts/profile_art.py
      - name: Commit refreshed profile artwork
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap and profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg ascii-portrait.svg info-card.svg"
