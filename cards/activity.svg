<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">GitHub activity by month</title><desc id="d">Monthly contribution activity, current streak, active days and busiest day from public GitHub calendar data.</desc><style>@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes print{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="1200" height="360" rx="24" fill="#F4F4F1"/><text x="48" y="48" fill="#74747A" font-family="monospace" font-size="16" letter-spacing="2">THE LAST 12 MONTHS ON GITHUB</text><text x="48" y="112" fill="#111111" font-family="Georgia,serif" font-size="58" font-style="italic">47 active days</text><g><rect x="62" y="245.0" width="56" height="0.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.00s forwards"/><text x="90" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Dec</text><rect x="140" y="245.0" width="56" height="0.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.06s forwards"/><text x="168" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Jan</text><rect x="218" y="245.0" width="56" height="0.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.12s forwards"/><text x="246" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Feb</text><rect x="296" y="245.0" width="56" height="0.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.18s forwards"/><text x="324" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Mar</text><rect x="374" y="215.0" width="56" height="30.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.24s forwards"/><text x="402" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Apr</text><text x="402" y="205.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">2</text><rect x="452" y="245.0" width="56" height="0.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.30s forwards"/><text x="480" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">May</text><rect x="530" y="185.0" width="56" height="60.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.36s forwards"/><text x="558" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Jun</text><text x="558" y="175.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">4</text><rect x="608" y="95.0" width="56" height="150.0" rx="7" fill="#3157F5" opacity="0" style="animation:rise .55s 0.42s forwards"/><text x="636" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Jul</text><text x="636" y="85.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">10</text><rect x="686" y="125.0" width="56" height="120.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.48s forwards"/><text x="714" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Aug</text><text x="714" y="115.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">8</text><rect x="764" y="95.0" width="56" height="150.0" rx="7" fill="#3157F5" opacity="0" style="animation:rise .55s 0.54s forwards"/><text x="792" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Sep</text><text x="792" y="85.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">10</text><rect x="842" y="95.0" width="56" height="150.0" rx="7" fill="#3157F5" opacity="0" style="animation:rise .55s 0.60s forwards"/><text x="870" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Oct</text><text x="870" y="85.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">10</text><rect x="920" y="200.0" width="56" height="45.0" rx="7" fill="#111111" opacity="0" style="animation:rise .55s 0.66s forwards"/><text x="948" y="273" text-anchor="middle" fill="#74747A" font-family="monospace" font-size="12">Nov</text><text x="948" y="190.0" text-anchor="middle" fill="#3157F5" font-family="monospace" font-size="11">3</text></g><text x="1000" y="105" fill="#111111" font-family="Georgia,serif" font-size="54" font-style="italic">0 days</text><text x="1000" y="133" fill="#74747A" font-family="Arial,sans-serif" font-size="17">current streak</text><path d="M1000 158H1150" stroke="#D8D8D2"/><text x="1000" y="220" fill="#111111" font-family="Georgia,serif" font-size="46" font-style="italic">47</text><text x="1000" y="248" fill="#74747A" font-family="Arial,sans-serif" font-size="16">active days</text><path d="M1000 270H1150" stroke="#D8D8D2"/><text x="1000" y="320" fill="#111111" font-family="Georgia,serif" font-size="34" font-style="italic">—</text><text x="1060" y="319" fill="#74747A" font-family="Arial,sans-serif" font-size="14">best day</text></svg>